<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NOXCUSE · vidéo « Tuto en 5 étapes »</title>
<style>
  @font-face { font-family: Black; src: url(Archivo-Black.ttf); }
  @font-face { font-family: Wide; src: url(Archivo-ExpandedExtraBold.ttf); }
  @font-face { font-family: Semi; src: url(Archivo-SemiBold.ttf); }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #111214; color: #F5F5F0; }
  #shot { position: absolute; inset: 0; }
  /* Safe area: clear of TikTok's bottom 350 px and right 150 px. */
  #safe { position: absolute; left: 70px; right: 150px; top: 150px; bottom: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; }
  #big { font-family: Black; line-height: .92; letter-spacing: -0.025em; word-spacing: 0.08em; }
  #sub { font-family: Semi; font-size: 52px; line-height: 1.15; }
  #art { display: flex; align-items: center; justify-content: center; }
  .notif { width: 860px; height: 170px; border-radius: 40px; background: rgba(58,59,66,.97); display: flex; align-items: center; gap: 26px; padding: 0 30px; box-sizing: border-box; text-align: left; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .notif img { width: 92px; height: 92px; border-radius: 22px; }
  .notif .t { font-family: Semi; font-size: 28px; color: #A3A4A9; }
  .notif .b { font-family: Semi; font-size: 36px; color: #F5F5F0; margin-top: 4px; }
  .av { width: 150px; height: 150px; border-radius: 75px; display: inline-flex; align-items: center; justify-content: center; font-family: Black; font-size: 64px; color: #0E0E0F; margin: 0 8px; }
  .o { color: #FF6A3D; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><div id="shot"><div id="safe"><div id="art"></div><div id="big"></div><div id="sub"></div></div></div><div id="flash"></div></div>
<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const back = (x) => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  const BEAT = 0.55; // ~109 bpm: punchy but every line can be read
  const K = '#111214', O = '#FF6A3D', P = '#ECECE8', W = '#F5F5F0';
  const notif = (when, body) => `<div class="notif"><img src="icon.png"><div><div class="t">NOXCUSE · ${when}</div><div class="b">${body}</div></div></div>`;
  const bar = (n) => `<svg viewBox="0 0 900 360" width="860" height="344"><rect x="0" y="168" width="900" height="24" rx="12" fill="#8A9099"/><rect x="380" y="160" width="140" height="40" rx="10" fill="#5E6066"/>` +
    Array.from({ length: n }, (_, i) => { const c = i === n - 1 ? O : ['#F5F5F0', '#B9BBC0', '#7C7E84', '#D9DADD'][i % 4]; return `<rect x="${320 - i * 58}" y="40" width="48" height="280" rx="10" fill="${c}"/><rect x="${532 + i * 58}" y="40" width="48" height="280" rx="10" fill="${c}"/>`; }).join('') + '</svg>';
  const avatars = (n) => ['Toi', 'Sam', 'Alex', 'Lou'].slice(0, n).map((x, i) => `<span class="av" style="background:${i ? ['#F5F5F0', '#B9BBC0', '#7C7E84'][i - 1] : O}">${x[0]}</span>`).join('');
  const ring = `<svg viewBox="0 0 600 600" width="520" height="520"><circle cx="300" cy="300" r="250" stroke="${O}" stroke-width="40" fill="none"/><text x="300" y="345" text-anchor="middle" font-family="Wide" font-size="130" fill="${W}">40:00</text></svg>`;

  const card = (inner, extra = '') => `<div style="width:840px;background:#1D1E22;border-radius:40px;padding:34px;box-sizing:border-box;text-align:left;${extra}">${inner}</div>`;
  const gym = card(`<div style="height:100px;border-radius:26px;background:#2E2F35;display:flex;align-items:center;padding:0 28px;font-family:Semi;font-size:40px;color:#A3A4A9">🔍 Salles autour de moi</div>` +
    [['Ta salle', '350 m', 1], ['Une autre salle', '1,2 km', 0], ['Encore une salle', '2,8 km', 0]].map(([n, d, on]) =>
      `<div style="display:flex;align-items:center;gap:22px;margin-top:20px;padding:26px;border-radius:26px;background:${on ? O : '#24252A'};color:${on ? K : W}"><span style="width:26px;height:26px;border-radius:13px;background:${on ? K : O}"></span><span style="font-family:Black;font-size:44px;flex:1">${n}</span><span style="font-family:Semi;font-size:34px">${d}</span></div>`).join(''));
  const goal = `<div style="display:flex;gap:22px">` + [2, 3, 4, 5].map((n) => `<div id="g${n}" style="width:190px;height:240px;border-radius:36px;background:#1D1E22;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Wide;font-size:110px">${n}<span style="font-family:Semi;font-size:28px;color:#A3A4A9">/ sem.</span></div>`).join('') + '</div>';
  const invite = card(`<div style="font-family:Black;font-size:30px;letter-spacing:4px;color:#A3A4A9">CODE DE TA TEAM</div><div style="font-family:Wide;font-size:96px;letter-spacing:-2px;margin:10px 0 26px">K7PX-M2QR</div><div style="display:flex;align-items:center;gap:6px">${avatars(4).replaceAll('150px', '110px').replaceAll('75px', '55px').replaceAll('64px', '48px')}<span style="margin-left:auto;background:${O};color:${K};font-family:Black;font-size:30px;white-space:nowrap;border-radius:40px;padding:18px 26px">PARTAGER ↗</span></div>`);
  const geo = `<div style="position:relative;width:840px;height:620px;border-radius:40px;overflow:hidden;background:#16171A">
    <svg width="840" height="620" style="position:absolute;inset:0"><g stroke="#2A2B30" stroke-width="22" fill="none"><path d="M-20 140 L860 220"/><path d="M-20 470 L860 380"/><path d="M230 -20 L300 640"/><path d="M620 -20 L560 640"/></g><g stroke="#222327" stroke-width="10"><path d="M-20 300 L860 300"/><path d="M420 -20 L420 640"/></g></svg>
    <div id="ringA" style="position:absolute;left:420px;top:300px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:4px solid ${O};opacity:.5"></div>
    <div style="position:absolute;left:420px;top:300px;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:22px;background:${O};box-shadow:0 0 0 10px rgba(255,106,61,.3)"></div>
    <div id="geoN" style="position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center">${notif('maintenant', 'Séance validée · +20 kg 💪').replace('width: 860px', '').replace('class="notif"', 'class="notif" style="width:790px"')}</div></div>`;
  const poster = `<div style="width:520px;height:760px;background:${P};border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative;overflow:hidden;transform:rotate(-4deg)">
    <div style="position:absolute;left:36px;top:40px;font-family:Black;font-size:230px;line-height:.82;letter-spacing:-14px;color:${K};text-align:left">SK<br>IP</div>
    <img src="canap-smug.svg" style="position:absolute;left:120px;top:440px;width:300px">
    <div style="position:absolute;left:0;right:0;bottom:26px;font-family:Black;font-size:30px;color:${K}">LOU A CHOISI LE CANAP'.</div></div>`;
  const outro = `<svg id="arrow" viewBox="0 0 200 220" width="200" height="220"><path d="M100 10 L180 110 L130 110 L130 210 L70 210 L70 110 L20 110 Z" fill="${O}"/></svg>`;
  const step = (n) => [1, O, `${n}`, 420, K, '', '', 'thud'];

  // [beats, background, big text, size, colour, sub text, art html, sound tag]
  const SHOTS = [
    [4, K, '<span style="font-size:88px">COMMENT ON VA</span><br>À LA SALLE<br>DE SPORT<br><span class="o" style="font-size:300px;line-height:1">À 4</span><br>SANS JAMAIS<br>SKIP.', 124, W, '', '', 'thud'],
    step(1),
    [3, K, '', 0, W, 'Choisis ta salle', gym, 'pop'],
    step(2),
    [3, K, '', 0, W, 'Ton objectif par semaine', goal, 'goal'],
    step(3),
    [3, K, '', 0, W, 'Invite tes potes<br>(ton abo les couvre, jusqu’à 4)', invite, 'pop'],
    step(4),
    [4, K, '', 0, W, 'Va à la salle.<br>L’app valide toute seule.', geo, 'geo'],
    step(5),
    [4, K, '', 0, W, 'Dimanche 20 h : qui a skip<br>prend la carte devant la team.', poster, 'poster'],
    [2, O, 'C’EST<br>TOUT.', 230, K, '', '', 'clap'],
    [9, K, 'LIEN<br>DANS<br>LA BIO', 210, W, '<span style="font-family:Black;font-size:90px;letter-spacing:-4px">NOXCUSE<span class="o">.</span></span>', outro, 'end'],
  ];
  let acc = 0.2;
  const TIMED = SHOTS.map((s) => { const a = acc; acc += s[0] * BEAT; return [a, acc, ...s]; });
  window.SHOTS = TIMED.map(([a, , , , , , , , , snd]) => [Number(a.toFixed(3)), snd]);
  window.BEAT = BEAT;
  window.DURATION = acc;
  let current = -1;

  window.render = (t) => {
    let i = TIMED.findIndex(([a, b]) => t >= a && t < b);
    if (i < 0) i = t < TIMED[0][0] ? 0 : TIMED.length - 1;
    const [a, b, , bg, big, size, col, sub, art] = TIMED[i];
    if (i !== current) {
      current = i;
      $('stage').style.background = bg;
      $('big').innerHTML = big; $('big').style.fontSize = `${size}px`; $('big').style.color = col;
      $('big').style.display = big ? 'block' : 'none';
      $('sub').innerHTML = sub; $('sub').style.color = bg === K ? W : K;
      $('sub').style.display = sub ? 'block' : 'none';
      $('art').innerHTML = art; $('art').style.display = art ? 'flex' : 'none';
      // Widest text line, so the zoom punch never pushes it off screen (1040 px max with the tilt).
      $('shot').style.transform = 'none';
      const r = document.createRange(); r.selectNodeContents($('big'));
      const w = big ? Math.max(...[...r.getClientRects()].map((x) => x.width)) : 0;
      $('shot').dataset.fit = w ? String(Math.max(1, 1000 / w)) : '9';
    }
    const p = seg(t, a, a + 0.16), local = t - a;
    // Every cut: zoom punch + small tilt alternating sides + screen shake.
    const dir = i % 2 ? 1 : -1;
    let scale = 1 + (1 - easeOut(p)) * 0.35 + local * 0.05;
    let rot = (1 - easeOut(p)) * 6 * dir;
    const sh = p < 1 && t >= TIMED[0][0] ? Math.sin(p * 40) * 18 * (1 - p) : 0;
    // The very first frame (also the cover) is still and straight.
    if (t < TIMED[0][0] + 0.02) { scale = 1; rot = 0; }
    const fit = Number($('shot').dataset.fit);
    if (scale > fit) { scale = fit; rot *= 0.3; }
    if (i === TIMED.length - 1) { scale = 1 + (1 - easeOut(seg(t, a, a + 0.25))) * 0.5; rot = 0; }
    $('shot').style.transform = `translate(${sh}px, ${sh * 0.5}px) rotate(${rot}deg) scale(${scale})`;
    // Art pops in with a bounce, notifications drop from the top.
    const ap = seg(t, a, a + 0.28);
    $('art').style.transform = TIMED[i][9] === 'notif' ? `translateY(${(1 - back(ap)) * -500}px)` : `scale(${Math.max(0.01, back(ap))})`;
    if (TIMED[i][9] === 'crush') $('art').style.transform = `translateY(${(1 - easeOut(ap)) * -600}px) scaleY(${1 - 0.25 * Math.sin(seg(t, a + 0.28, a + 0.6) * Math.PI)})`;
    if (TIMED[i][9] === 'goal') {
      const on = t > a + 0.8;
      $('g3').style.background = on ? O : '#1D1E22'; $('g3').style.color = on ? K : W;
      $('g3').style.transform = `scale(${1 + 0.12 * Math.sin(seg(t, a + 0.8, a + 1.1) * Math.PI)})`;
    }
    if (TIMED[i][9] === 'geo') {
      const k = ((t - a) * 0.9) % 1; $('ringA').style.transform = `scale(${0.3 + k * 1.2})`; $('ringA').style.opacity = String(0.7 * (1 - k));
      const np = seg(t, a + 1.0, a + 1.3); $('geoN').style.opacity = np; $('geoN').style.transform = `translateY(${(1 - back(np)) * 200}px)`;
    }
    if (TIMED[i][9] === 'poster') $('art').style.transform = `translateY(${(1 - back(ap)) * -900}px)`;
    if (TIMED[i][9] === 'typing') {
      const word = 'NOXCUSE', n = Math.floor(seg(t, a + 0.3, a + 1.3) * word.length + 0.001);
      $('typed').textContent = word.slice(0, n);
      $('caret').style.opacity = Math.floor(t * 3) % 2 ? 1 : 0.2;
      const rp = seg(t, a + 1.45, a + 1.75); $('result').style.opacity = rp; $('result').style.transform = `translateY(${(1 - back(rp)) * 80}px)`;
    }
    if (TIMED[i][9] === 'end') {
      $('art').style.transform = `translateY(${-Math.abs(Math.sin((t - a) * 5)) * 40}px)`;
      const sp = seg(t, a + 0.6, a + 0.86);
      $('sub').style.opacity = sp; $('sub').style.transform = `scale(${Math.max(0.01, back(sp)) * (1 + (t > a + 1.2 ? 0.035 * Math.sin((t - a) * 7) : 0))})`;
    } else { $('sub').style.opacity = 1; $('sub').style.transform = ''; }
    $('flash').style.opacity = String(Math.max(0, 0.22 * (1 - seg(t, a, a + 0.08))) * (t >= TIMED[0][0] ? 1 : 0));
  };
  window.render(0);
</script>
</body>
</html>
