<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NOXCUSE · captures App Store</title>
<style>
  @font-face { font-family: Black; src: url(Archivo-Black.ttf); }
  @font-face { font-family: Wide; src: url(Archivo-ExpandedExtraBold.ttf); }
  @font-face { font-family: Semi; src: url(Archivo-SemiBold.ttf); }
  html, body { margin: 0; background: #000; }
  #shot { position: relative; width: 1290px; height: 2796px; overflow: hidden; background: #111214; color: #F5F5F0; }
  #shot.paper { background: #ECECE8; color: #0E0E0F; }
  #glow { position: absolute; left: -200px; right: -200px; top: 1200px; height: 1400px; background: radial-gradient(ellipse at center, rgba(255,106,61,.28), transparent 62%); }
  #kicker { position: absolute; left: 100px; top: 150px; font-family: Wide; font-size: 40px; letter-spacing: 6px; color: #FF6A3D; }
  #title { position: absolute; left: 100px; right: 100px; top: 215px; font-family: Wide; font-size: 104px; line-height: 1; letter-spacing: -3px; text-transform: uppercase; }
  #title .o { color: #FF6A3D; }
  #phone { position: absolute; left: 175px; top: 760px; width: 940px; height: 2037px; border-radius: 110px; border: 14px solid #2A2B30; overflow: hidden; background: #000; box-shadow: 0 40px 120px rgba(0,0,0,.55); }
  #shot.paper #phone { border-color: #0E0E0F; }
  #phone img { width: 100%; display: block; }
  #island { position: absolute; left: 50%; top: 26px; width: 250px; height: 72px; margin-left: -125px; border-radius: 40px; background: #000; }
</style>
</head>
<body>
<div id="shot"><div id="glow"></div><div id="kicker"></div><div id="title"></div><div id="phone"><img id="img"><div id="island"></div></div></div>
<script>
  const SHOTS = {
    team: ['TA TEAM', 'Charge la barre <span class="o">avec tes potes.</span>', 'dev_store_screen_team.png'],
    session: ['POINTAGE AUTO', 'Va à la salle. <span class="o">L’app valide.</span>', 'dev_store_screen_session.png'],
    skip: ['DIMANCHE, 20 H', 'Tu skip ? <span class="o">Ta team reçoit ta carte.</span>', 'dev_poster.png'],
    chat: ['LE CHAT DE LA TEAM', 'Motivez-vous. <span class="o">Chambrez-vous.</span>', 'dev_store_screen_chat.png'],
    lifter: ['TA PROGRESSION', 'Séries, niveaux, <span class="o">Ceinture du mois.</span>', 'dev_lifter.png'],
    shop: ['LA BOUTIQUE', 'Des cartes SKIP <span class="o">qui piquent.</span>', 'dev_shop.png'],
    brand: ['ZÉRO EXCUSE', 'Tes potes comptent <span class="o">sur toi.</span>', 'dev_welcome.png'],
  };
  const [k, t, img] = SHOTS[location.hash.slice(1)] || SHOTS.team;
  document.getElementById('kicker').textContent = k;
  document.getElementById('title').innerHTML = t;
  document.getElementById('img').src = 'raw/' + img;
</script>
</body>
</html>
